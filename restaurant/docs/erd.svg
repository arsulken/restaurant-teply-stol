<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#344c40"/></marker><marker id="tri" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="white" stroke="#344c40"/></marker></defs><g font-family="Arial" fill="#233c2e"><text x="30" y="35" font-size="26" text-anchor="start">ERD — физическая схема SQLite</text><rect x="40" y="80" width="310" height="250" rx="3" fill="#fff" stroke="#344c40" stroke-width="2"/><rect x="41" y="81" width="308" height="39" fill="#e7ece3"/><text x="195.0" y="107" font-size="21" text-anchor="middle">users</text><line x1="40" y1="120" x2="350" y2="120" stroke="#344c40" stroke-width="2" /><text x="52" y="146" font-size="18" text-anchor="start">PK id INTEGER</text><text x="52" y="173" font-size="18" text-anchor="start">name TEXT</text><text x="52" y="200" font-size="18" text-anchor="start">UNIQUE email TEXT</text><text x="52" y="227" font-size="18" text-anchor="start">password_hash TEXT</text><text x="52" y="254" font-size="18" text-anchor="start">role TEXT</text><rect x="445" y="80" width="310" height="250" rx="3" fill="#fff" stroke="#344c40" stroke-width="2"/><rect x="446" y="81" width="308" height="39" fill="#e7ece3"/><text x="600.0" y="107" font-size="21" text-anchor="middle">orders</text><line x1="445" y1="120" x2="755" y2="120" stroke="#344c40" stroke-width="2" /><text x="457" y="146" font-size="18" text-anchor="start">PK id INTEGER</text><text x="457" y="173" font-size="18" text-anchor="start">FK user_id → users.id</text><text x="457" y="200" font-size="18" text-anchor="start">status TEXT</text><text x="457" y="227" font-size="18" text-anchor="start">total INTEGER</text><text x="457" y="254" font-size="18" text-anchor="start">created_at, comment TEXT</text><rect x="850" y="80" width="310" height="250" rx="3" fill="#fff" stroke="#344c40" stroke-width="2"/><rect x="851" y="81" width="308" height="39" fill="#e7ece3"/><text x="1005.0" y="107" font-size="21" text-anchor="middle">order_items</text><line x1="850" y1="120" x2="1160" y2="120" stroke="#344c40" stroke-width="2" /><text x="862" y="146" font-size="18" text-anchor="start">PK id INTEGER</text><text x="862" y="173" font-size="18" text-anchor="start">FK order_id → orders.id</text><text x="862" y="200" font-size="18" text-anchor="start">FK dish_id → dishes.id</text><text x="862" y="227" font-size="18" text-anchor="start">name TEXT</text><text x="862" y="254" font-size="18" text-anchor="start">price, quantity INTEGER</text><rect x="40" y="480" width="310" height="190" rx="3" fill="#fff" stroke="#344c40" stroke-width="2"/><rect x="41" y="481" width="308" height="39" fill="#e7ece3"/><text x="195.0" y="507" font-size="21" text-anchor="middle">sessions</text><line x1="40" y1="520" x2="350" y2="520" stroke="#344c40" stroke-width="2" /><text x="52" y="546" font-size="18" text-anchor="start">PK token TEXT</text><text x="52" y="573" font-size="18" text-anchor="start">FK user_id → users.id</text><text x="52" y="600" font-size="18" text-anchor="start">expires INTEGER</text><rect x="445" y="480" width="310" height="190" rx="3" fill="#fff" stroke="#344c40" stroke-width="2"/><rect x="446" y="481" width="308" height="39" fill="#e7ece3"/><text x="600.0" y="507" font-size="21" text-anchor="middle">cart_items</text><line x1="445" y1="520" x2="755" y2="520" stroke="#344c40" stroke-width="2" /><text x="457" y="546" font-size="18" text-anchor="start">PK FK user_id → users.id</text><text x="457" y="573" font-size="18" text-anchor="start">PK FK dish_id → dishes.id</text><text x="457" y="600" font-size="18" text-anchor="start">quantity INTEGER</text><rect x="850" y="480" width="310" height="250" rx="3" fill="#fff" stroke="#344c40" stroke-width="2"/><rect x="851" y="481" width="308" height="39" fill="#e7ece3"/><text x="1005.0" y="507" font-size="21" text-anchor="middle">dishes</text><line x1="850" y1="520" x2="1160" y2="520" stroke="#344c40" stroke-width="2" /><text x="862" y="546" font-size="18" text-anchor="start">PK id INTEGER</text><text x="862" y="573" font-size="18" text-anchor="start">name, category TEXT</text><text x="862" y="600" font-size="18" text-anchor="start">description TEXT</text><text x="862" y="627" font-size="18" text-anchor="start">price INTEGER</text><text x="862" y="654" font-size="18" text-anchor="start">stock INTEGER</text><line x1="350" y1="200" x2="445" y2="200" stroke="#344c40" stroke-width="2" /><text x="358" y="188" font-size="18" text-anchor="start">1</text><text x="402" y="188" font-size="18" text-anchor="start">0..N</text><line x1="755" y1="200" x2="850" y2="200" stroke="#344c40" stroke-width="2" /><text x="763" y="188" font-size="18" text-anchor="start">1</text><text x="807" y="188" font-size="18" text-anchor="start">1..N</text><line x1="195" y1="330" x2="195" y2="480" stroke="#344c40" stroke-width="2" /><text x="205" y="354" font-size="18" text-anchor="start">1</text><text x="205" y="466" font-size="18" text-anchor="start">0..N</text><line x1="755" y1="565" x2="850" y2="565" stroke="#344c40" stroke-width="2" /><text x="763" y="553" font-size="18" text-anchor="start">0..N</text><text x="807" y="553" font-size="18" text-anchor="start">1</text><line x1="1005" y1="330" x2="1005" y2="480" stroke="#344c40" stroke-width="2" /><text x="1015" y="354" font-size="18" text-anchor="start">0..N</text><text x="1015" y="466" font-size="18" text-anchor="start">1</text><line x1="305" y1="330" x2="490" y2="480" stroke="#344c40" stroke-width="2" /><text x="327" y="355" font-size="18" text-anchor="start">1</text><text x="445" y="448" font-size="18" text-anchor="start">0..N</text><text x="30" y="787" font-size="19" text-anchor="start">PK — первичный ключ. FK — внешний ключ. Цена и итог хранятся целыми числами в копейках.</text></g></svg>